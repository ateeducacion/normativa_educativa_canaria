observaciones: "[TAREA-082, 2026-08-05] Fuente oficial localizada y catalogada: Resolución de 21 de junio de 2022, de la Secretaría de Estado de Educación (BOE-A-2022-10452, BOE núm. 150 de 24/06/2022), Anexo II (Religión Católica de Educación Primaria) — ficha FTE-079, y ficha normativa NOR-072 para la propia resolución. Confirma la nota previa de TAREA-067: NOR-043 (Decreto 211/2022) no contiene el currículo de Religión; su Disposición adicional primera, punto 6, remite esa competencia a la jerarquía eclesiástica y a esta resolución del Ministerio, publicada 'a propuesta de la Conferencia Episcopal Española'. Campo 'fuente' reapuntado de FTE-046 (que en realidad describe el propio Decreto 211/2022, no el currículo de Religión) a FTE-079; 'url_oficial' actualizado al BOE. VERIFICACIÓN DEL CONTENIDO EXISTENTE contra el Anexo II de FTE-079/NOR-072 (texto oficial descargado en HTML y PDF, 2026-08-05): NO COINCIDE. (1) Competencias específicas: el Anexo II tiene 6 competencias específicas con texto literal propio (numeradas 1 a 6, cada una con un enunciado de una frase y conectada a descriptores del Perfil de salida); las 6 competencias ya registradas en esta ficha (C1-C6, campo 'descripcion') son títulos/paráfrasis breves ('Identidad y Trascendencia', 'Diversidad y Convivencia'...) que no reproducen ese texto literal ni coinciden en su formulación. (2) Saberes básicos: el Anexo II organiza los saberes en 3 bloques por ciclo, titulados exactamente 'A. Identidad personal y relaciones en diálogo con el mensaje cristiano', 'B. Cosmovisiones, tradición cristiana y cultura' y 'C. Habitar el mundo plural y diverso para construir la casa común', con contenido propio en cada ciclo; esta ficha tiene 4 bloques únicos para toda la etapa ('Bloque A: El sentido de la vida', 'Bloque B: La Biblia', 'Bloque C: Jesús y la Iglesia', 'Bloque D: El compromiso') que no coinciden en número, título ni estructura por ciclo. (3) Criterios de evaluación: el Anexo II fija, para cada uno de los tres ciclos, 2 criterios por cada una de las 6 competencias específicas (12 criterios por ciclo, numerados 1.1-6.2); esta ficha solo tiene 2 criterios por ciclo, cubriendo cada ciclo solo 2 de las 6 competencias (ciclo 1: 1.1 y 4.1; ciclo 2: 2.1 y 3.1; ciclo 3: 5.1 y 6.1), sin cobertura de las competencias restantes en cada ciclo. Conforme a las instrucciones de TAREA-082, NO SE HA CORREGIDO este contenido: es una decisión editorial (¿reextraer todo desde FTE-079, o el contenido actual procede de otra fuente no identificada, por ejemplo una versión autonómica o de otra editorial?) que excede el alcance de catalogación de esta tarea. estado_extraccion se mantiene en 'parcial' porque el contenido no verifica contra la fuente ahora trazada. Pendiente de decisión editorial y, si procede, de una TAREA de re-extracción completa de competencias, criterios y saberes desde el Anexo II de FTE-079."
