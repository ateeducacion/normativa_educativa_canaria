id: CUR-033
titulo: "Religión — Primaria Canarias"
etapa: "primaria"
materia: "Religión"
norma_base: NOR-043
fuente: FTE-046
url_oficial: "https://www.gobiernodecanarias.org/boc/2022/231/001.html"
fecha_consulta: "2026-04-26"
estado_extraccion: "parcial"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - id: C1
      descripcion: "Identidad y Trascendencia: Descubrir y aceptar la propia identidad reconociendo la apertura a la trascendencia."
    - id: C2
      descripcion: "Diversidad y Convivencia: Reconocer la diversidad cultural y religiosa identificando elementos del mensaje cristiano."
    - id: C3
      descripcion: "Lenguajes de la Fe: Expresar la experiencia religiosa a través de diferentes lenguajes (artístico, simbólico...)."
    - id: C4
      descripcion: "Patrimonio Religioso: Identificar y valorar el patrimonio cultural y artístico de carácter religioso."
    - id: C5
      descripcion: "Solidaridad y Valores: Participar en la construcción de un mundo justo e inspirándose en el Evangelio."
    - id: C6
      descripcion: "Espiritualidad e Interioridad: Desarrollar la dimensión espiritual a través del silencio y la reflexión."
  saberes_basicos:
    - id: sentido-vida
      nombre: "Bloque A: El sentido de la vida"
      descripcion: "La vida como regalo, la alegría de compartir y la dimensión social."
    - id: biblia
      nombre: "Bloque B: La Biblia"
      descripcion: "Relatos del Antiguo y Nuevo Testamento, la Biblia como biblioteca de fe."
    - id: jesus-iglesia
      nombre: "Bloque C: Jesús y la Iglesia"
      descripcion: "Vida de Jesús, las parábolas, los sacramentos y la labor social de la Iglesia."
    - id: compromiso
      nombre: "Bloque D: El compromiso"
      descripcion: "Cuidado de la naturaleza, solidaridad, justicia y desarrollo sostenible (Laudato Si')."
  criterios_evaluacion:
    - ciclo: 1
      criterios:
        - id: 1.1
          texto: "Identificar y expresar las propias cualidades y limitaciones, aceptándose con confianza."
        - id: 4.1
          texto: "Reconocer elementos básicos del patrimonio religioso local (iglesias, fiestas, símbolos)."
    - ciclo: 2
      criterios:
        - id: 2.1
          texto: "Comparar diferentes tradiciones religiosas presentes en la sociedad, valorando el respeto."
        - id: 3.1
          texto: "Comunicar el mensaje de las parábolas de Jesús utilizando recursos creativos."
    - ciclo: 3
      criterios:
        - id: 5.1
          texto: "Participar activamente en iniciativas de transformación social y cuidado de la 'casa común' (Laudato Si')."
        - id: 6.1
          texto: "Consolidar hábitos de interioridad, discernimiento y compromiso ético."
relaciones:
  desarrolla_a: [NOR-043]
  relacionada_con: []
observaciones: "[PENDIENTE] TAREA-067 no puede completar esta ficha desde NOR-043: el Decreto 211/2022 NO contiene el currículo del área de Religión. Su Disposición adicional primera, punto 6 (texto-oficial-NOR-043-decreto-211-2022-primaria.txt, líneas 1168-1172), remite la determinación del currículo de la enseñanza de religión católica y de las demás confesiones con acuerdo de cooperación a la jerarquía eclesiástica o a las autoridades religiosas correspondientes, con publicación a cargo del Ministerio competente; el Anexo 2 de NOR-043 no incluye ningún bloque de competencias específicas, criterios de evaluación ni saberes básicos para Religión (confirmado por búsqueda en el texto completo). Las competencias, criterios y saberes que ya figuran en esta ficha no se han podido verificar contra NOR-043 ni contra ninguna otra fuente registrada en 06_indices/fuentes.yaml: la nota previa citaba «BOE 24-06-2022» sin ficha FTE-NNN asociada, por lo que incumple R1 (trazabilidad a fuente oficial con ficha interna). No se han modificado ni renombrado estos campos ('descripcion'/'id') para no dar apariencia de literalidad verificada al renombrarlos a 'enunciado_oficial'/'codigo'. Se mantiene estado_extraccion: parcial. Antes de reintentar esta ficha hace falta: (1) catalogar como FTE-NNN la fuente oficial real del currículo de Religión Católica en Primaria (BOE, resolución/orden de currículo del área), (2) exportar su texto a 07_corpus_ia/textos-completos/ conforme a R16, y (3) registrar una PREG-NNN o TAREA de seguimiento, ya que esta tarea no puede tocar 08_tareas/ ni 06_indices/."
