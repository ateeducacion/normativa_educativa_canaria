id: CUR-034
titulo: "Crecimiento en Armonía — Infantil Canarias"
etapa: "infantil"
materia: "Crecimiento en Armonía"
norma_base: NOR-047
fuente: FTE-050
url_oficial: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
fecha_consulta: 2026-04-26
estado_extraccion: "parcial"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Progresar en el conocimiento y control de su cuerpo y en la adquisición de distintas estrategias, adecuando sus acciones a la realidad del entorno de una manera segura, para construir una autoimagen ajustada y positiva."
    - codigo: "C2"
      enunciado_oficial: "Reconocer, manifestar y regular progresivamente sus emociones, expresando necesidades y sentimientos para lograr bienestar emocional y seguridad afectiva."
    - codigo: "C3"
      enunciado_oficial: "Adoptar modelos, normas y hábitos, desarrollando la confianza en sus posibilidades y sentimientos de logro, para promover un estilo de vida saludable y ecosocialmente responsable."
    - codigo: "C4"
      enunciado_oficial: "Establecer interacciones sociales en condiciones de igualdad, valorando la importancia de la amistad, el respeto y la empatía hacia sus iguales y las personas adultas, para construir su propia identidad basada en valores democráticos y de respeto a los derechos humanos."
  saberes_basicos:
    - id: control-cuerpo
      nombre: "Bloque 1: El cuerpo y el control progresivo del mismo"
      descripcion: "Esquema corporal, lateralidad, coordinación, equilibrio y conocimiento de sí mismo."
    - id: equilibrio-afectivo
      nombre: "Bloque 2: Desarrollo y equilibrio afectivo"
      descripcion: "Identificación de emociones, autorregulación y seguridad afectiva."
    - id: habitos-saludables
      nombre: "Bloque 3: Hábitos de vida saludable para el autocuidado y el cuidado del entorno"
      descripcion: "Alimentación, higiene, descanso y prevención de accidentes."
    - id: interaccion-socioemocional
      nombre: "Bloque 4: Interacción socioemocional en el entorno. La vida junto a los demás"
      descripcion: "Relaciones con iguales y adultos, normas de convivencia y respeto."
  criterios_evaluacion:
    - ciclo: 0-3
      criterios:
        - id: 1.1
          texto: "Explorar su propio cuerpo y sus posibilidades motrices en situaciones de juego y rutinas."
        - id: 2.1
          texto: "Manifestar sus necesidades y sentimientos a través del lenguaje corporal y gestual."
    - ciclo: 3-6
      criterios:
        - id: 1.1
          texto: "Identificar y describir las características físicas propias y de los demás, aceptando la diversidad."
        - id: 4.1
          texto: "Participar en las rutinas de higiene y alimentación de forma progresivamente autónoma."
relaciones:
  desarrolla_a: [NOR-047]
  relacionada_con: []
observaciones: "TAREA-079 (2026-08-05): las 4 competencias específicas se han sustituido por el enunciado_oficial literal del Decreto 196/2022 (claves 'codigo'/'enunciado_oficial', DEC-0008), verificado directamente contra el PDF oficial del BOC (ANEXO 2, ÁREA 1, bloques competenciales, págs. 41052-41056), porque la copia local en 07_corpus_ia/textos-completos/texto-oficial-NOR-047-... no conserva esas tablas (solo un marcador \"Ver anexo en las páginas...\"). Dos de las competencias previas coincidían por casualidad con el texto oficial pero en orden distinto (C3/C4 intercambiadas); las otras dos eran resúmenes no literales. [PENDIENTE] Al comprobar criterios_evaluacion y saberes_basicos contra el mismo PDF se observa que tampoco son literales (son resúmenes/paráfrasis, no el texto exacto del decreto); la ficha sigue en 'parcial' hasta que se transcriban literalmente en una tarea de seguimiento. Faltan también los descriptores operativos del perfil de salida que DEC-0004 exige para enseñanza básica; extracción marcada como parcial (DEC-0007). En Educación Infantil no existen los descriptores operativos del perfil de salida, que es de la enseñanza básica (DEC-0009), así que el cuarto elemento de DEC-0004 no aplica a esta ficha."
