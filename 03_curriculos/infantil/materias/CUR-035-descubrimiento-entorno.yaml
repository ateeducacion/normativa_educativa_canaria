id: CUR-035
titulo: "Descubrimiento y Exploración del Entorno — Infantil Canarias"
etapa: "infantil"
materia: "Descubrimiento y Exploración del Entorno"
norma_base: NOR-047
fuente: FTE-050
url_oficial: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
fecha_consulta: 2026-04-26
estado_extraccion: "parcial"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Identificar las características de materiales, objetos y colecciones y establecer relaciones entre ellos, mediante la exploración, la manipulación sensorial, el manejo de herramientas sencillas y el desarrollo de destrezas lógico-matemáticas para descubrir y crear una idea cada vez más compleja del mundo."
    - codigo: "C2"
      enunciado_oficial: "Desarrollar, de manera progresiva, los procedimientos del método científico y las destrezas del pensamiento computacional, a través de procesos de observación y manipulación de objetos, para iniciarse en la interpretación del entorno y responder de forma creativa a las situaciones y retos que se plantean."
    - codigo: "C3"
      enunciado_oficial: "Reconocer elementos y fenómenos de la naturaleza, mostrando interés por los hábitos que inciden sobre ella, para apreciar la importancia del uso sostenible, el cuidado y la conservación del entorno en la vida de las personas."
  saberes_basicos:
    - id: dialogo-corporal
      nombre: "Bloque 1: Diálogo corporal con el entorno. Exploración creativa de objetos, materiales y espacios"
      descripcion: "Atención, curiosidad y asombro; exploración sensorial; propiedades de los objetos."
    - id: experimentacion
      nombre: "Bloque 2: Experimentación en el entorno. Curiosidad, pensamiento científico y pensamiento computacional"
      descripcion: "Iniciación al método científico; resolución de problemas; orientación espacial y temporal; razonamiento lógico-matemático."
    - id: indagacion-natural
      nombre: "Bloque 3: Indagación en el medio físico y natural. Cuidado, valoración y respeto"
      descripcion: "Elementos naturales; seres vivos y clima; respeto y cuidado de la naturaleza; patrimonio natural de Canarias."
  criterios_evaluacion:
    - ciclo: 0-3
      criterios:
        - id: 1.1
          texto: "Identificar cualidades de los objetos (forma, tamaño, color) mediante la exploración libre."
        - id: 3.1
          texto: "Mostrar curiosidad por los animales y plantas del entorno cercano."
    - ciclo: 3-6
      criterios:
        - id: 1.1
          texto: "Establecer relaciones de orden y clasificación entre colecciones de objetos."
        - id: 2.1
          texto: "Plantear hipótesis sencillas para explicar fenómenos observados en el entorno."
relaciones:
  desarrolla_a: [NOR-047]
  relacionada_con: []
observaciones: "TAREA-079 (2026-08-05): las 3 competencias específicas se han sustituido por el enunciado_oficial literal del Decreto 196/2022 (claves 'codigo'/'enunciado_oficial', DEC-0008), verificado directamente contra el PDF oficial del BOC (ANEXO 2, ÁREA 2, bloques competenciales, págs. 41074-41076), porque la copia local en 07_corpus_ia/textos-completos/texto-oficial-NOR-047-... no conserva esas tablas (solo un marcador \"Ver anexo en las páginas...\"). Las tres competencias previas eran resúmenes que se apartaban del texto oficial en frases y cierres concretos. [PENDIENTE] Al comprobar criterios_evaluacion y saberes_basicos contra el mismo PDF se observa que tampoco son literales (son resúmenes/paráfrasis, no el texto exacto del decreto); la ficha sigue en 'parcial' hasta que se transcriban literalmente en una tarea de seguimiento. Faltan también los descriptores operativos del perfil de salida que DEC-0004 exige para enseñanza básica; extracción marcada como parcial (DEC-0007). En Educación Infantil no existen los descriptores operativos del perfil de salida, que es de la enseñanza básica (DEC-0009), así que el cuarto elemento de DEC-0004 no aplica a esta ficha."
