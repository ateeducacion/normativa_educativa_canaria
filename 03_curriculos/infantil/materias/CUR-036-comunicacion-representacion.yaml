id: CUR-036
titulo: "Comunicación y Representación de la Realidad — Infantil Canarias"
etapa: "infantil"
materia: "Comunicación y Representación de la Realidad"
norma_base: NOR-047
fuente: FTE-050
url_oficial: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
fecha_consulta: 2026-04-26
estado_extraccion: "parcial"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Manifestar interés por interactuar en situaciones cotidianas a través de la exploración y el uso de su repertorio comunicativo, para expresar sus necesidades e intenciones y responder a las exigencias del entorno."
    - codigo: "C2"
      enunciado_oficial: "Interpretar y comprender mensajes y representaciones apoyándose en conocimientos y recursos de su propia experiencia, para responder a las demandas del entorno y construir nuevos aprendizajes."
    - codigo: "C3"
      enunciado_oficial: "Producir mensajes de manera eficaz, personal y creativa, utilizando diferentes lenguajes, descubriendo los códigos de cada uno de ellos y explorando sus posibilidades expresivas, para responder a diferentes necesidades comunicativas."
    - codigo: "C4"
      enunciado_oficial: "Participar por iniciativa propia en actividades relacionadas con textos escritos, mostrando interés y curiosidad, para comprender su funcionalidad y algunas de sus características."
    - codigo: "C5"
      enunciado_oficial: "Valorar la diversidad lingüística presente en su entorno, para enriquecer sus estrategias comunicativas culturales."
  saberes_basicos:
    - id: intencion-comunicativa
      nombre: "Bloque 1: Intención y estrategias comunicativas"
      descripcion: "Deseo de comunicación; interacción con adultos e iguales; escucha activa."
    - id: lenguas-perfiles
      nombre: "Bloque 2: Lenguas y perfiles lingüísticos"
      descripcion: "Diversidad lingüística; lengua materna y aproximación a lenguas extranjeras."
    - id: comunicacion-oral
      nombre: "Bloque 3: Comunicación verbal oral"
      descripcion: "Expresión oral; vocabulario; comprensión de relatos y narraciones."
    - id: lenguaje-escrito
      nombre: "Bloque 4: Aproximación al lenguaje escrito"
      descripcion: "Lectura y escritura como herramientas de comunicación; carteles, cuentos y nombres propios."
    - id: educacion-literaria
      nombre: "Bloque 5: Aproximación a la educación literaria"
      descripcion: "Cuentos, poesías, adivinanzas; folclore canario."
    - id: lenguajes-artisticos
      nombre: "Bloques 6, 7 y 8: Lenguajes Musical, Plástico y Corporal"
      descripcion: "Expresión mediante el sonido, la imagen, el color y el movimiento; danza y dramatización."
    - id: alfabetizacion-digital
      nombre: "Bloque 9: Alfabetización digital"
      descripcion: "Uso crítico y creativo de las herramientas digitales de forma pautada."
  criterios_evaluacion:
    - ciclo: 0-3
      criterios:
        - id: 1.1
          texto: "Interactuar con los demás a través de gestos, sonidos y palabras para satisfacer necesidades."
        - id: 3.1
          texto: "Experimentar con diferentes materiales plásticos y sonidos para expresar ideas."
    - ciclo: 3-6
      criterios:
        - id: 4.1
          texto: "Escuchar y participar en la lectura de cuentos, identificando personajes y trama."
        - id: 9.1
          texto: "Iniciarse en el uso de dispositivos digitales para la creación o búsqueda de información de forma guiada."
relaciones:
  desarrolla_a: [NOR-047]
  relacionada_con: []
observaciones: "TAREA-079 (2026-08-05): las competencias específicas se han sustituido por el enunciado_oficial literal del Decreto 196/2022 (claves 'codigo'/'enunciado_oficial', DEC-0008), verificado directamente contra el PDF oficial del BOC (ANEXO 2, ÁREA 3, bloques competenciales, págs. 41096-41101), porque la copia local en 07_corpus_ia/textos-completos/texto-oficial-NOR-047-... no conserva esas tablas (solo un marcador \"Ver anexo en las páginas...\"). [HALLAZGO] El decreto establece cinco competencias específicas para esta área (\"se han establecido cinco competencias específicas\"), no cuatro: la ficha anterior omitía a C5 (\"Valorar la diversidad lingüística presente en su entorno...\") y su C4 no correspondía a ninguna competencia oficial (mezclaba temas de literatura infantil y arte que en el decreto son saberes básicos, no una competencia específica); se ha añadido C5 y corregido C3 y C4 con el texto oficial. C1 y C2 ya coincidían literalmente. [PENDIENTE] Al comprobar criterios_evaluacion y saberes_basicos contra el mismo PDF se observa que tampoco son literales (son resúmenes/paráfrasis, no el texto exacto del decreto); la ficha sigue en 'parcial' hasta que se transcriban literalmente en una tarea de seguimiento. Faltan también los descriptores operativos del perfil de salida que DEC-0004 exige para enseñanza básica; extracción marcada como parcial (DEC-0007). En Educación Infantil no existen los descriptores operativos del perfil de salida, que es de la enseñanza básica (DEC-0009), así que el cuarto elemento de DEC-0004 no aplica a esta ficha."
