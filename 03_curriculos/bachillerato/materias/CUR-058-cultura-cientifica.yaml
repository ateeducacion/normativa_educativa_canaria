elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Interpretar y transmitir información y datos científicos, argumentando sobre estos con precisión y utilizando diferentes formatos para analizar procesos, métodos, experimentos o resultados relacionados con la ciencia y la tecnología."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL2, CCL3, CP2, STEM2, STEM4, CD1, CD3, CPSAA4, CC3, CCEC3.2]
    - codigo: "C2"
      enunciado_oficial: "Localizar y utilizar fuentes fiables, identificando, seleccionando y organizando información, evaluándola críticamente y contrastando su veracidad, para resolver preguntas planteadas relacionadas con la ciencia y la tecnología de forma autónoma."
      descriptores:
        "1.º Bachillerato": [CCL2, CCL3, CP2, STEM4, CD1, CD2, CD3, CD4, CPSAA4, CC3]
    - codigo: "C3"
      enunciado_oficial: "Diseñar, planear y desarrollar proyectos de investigación siguiendo los pasos de las metodologías científicas, teniendo en cuenta los recursos disponibles de forma realista y buscando vías de colaboración, para indagar en aspectos relacionados con la ciencia y la tecnología."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL3, CCL5, STEM1, STEM2, STEM3, STEM4, CD1, CD2, CD3, CPSAA3.2, CE3]
    - codigo: "C4"
      enunciado_oficial: "Buscar y utilizar estrategias en la resolución de problemas analizando críticamente las soluciones y respuestas halladas y reformulando el procedimiento si fuera necesario, para proponer alternativas de carácter científico-tecnológico a los actuales retos de la humanidad."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL2, CCL3, STEM1, STEM2, CD1, CD5, CPSAA1.1, CPSAA5, CE1]
    - codigo: "C5"
      enunciado_oficial: "Investigar y analizar críticamente las consecuencias de determinadas acciones humanas y de los avances científico-tecnológicos sobre el medio y la vida de las personas, para proponer soluciones innovadoras que tengan en cuenta la preservación del medioambiente, la salud pública, el desarrollo económico sostenible y la búsqueda de una sociedad igualitaria, difundiendo el conocimiento científico desde una perspectiva holística."
      descriptores:
        "1.º Bachillerato": [CCL1, CCL3, CP2, STEM1, STEM2, STEM5, CD1, CD4, CD5, CPSAA2, CC4, CE1]
  descriptores_operativos: ["CCL1", "CCL2", "CCL3", "CCL5", "CP2", "STEM1", "STEM2", "STEM3", "STEM4", "STEM5", "CD1", "CD2", "CD3", "CD4", "CD5", "CPSAA1.1", "CPSAA2", "CPSAA3.2", "CPSAA4", "CPSAA5", "CC3", "CC4", "CE1", "CE3", "CCEC3.2"]
  saberes_basicos:
    - id: cultura-cientifica-base
      nombre: "I. Cultura científica y sociedad"
      descripcion: "Método científico, ética en la investigación y comunicación de la ciencia."
    - id: salud-medioambiente
      nombre: "II. Salud y medio ambiente"
      descripcion: "Grandes retos de la salud, biotecnología, cambio climático y ecosistemas de Canarias."
    - id: tecnologia-futuro
      nombre: "III. Tecnología y futuro"
      descripcion: "Nuevos materiales, exploración espacial, IA y sostenibilidad en el archipiélago."
  criterios_evaluacion:
    - id: 1.2
      texto: "Evaluar la fiabilidad de la información científica obtenida, distinguiendo entre datos basados en evidencias, opiniones y pseudociencias."
    - id: 4.3
      texto: "Identificar y valorar el papel de la investigación científica en Canarias (universidades e institutos de investigación)."
    - id: 5.3
      texto: "Participar activamente en acciones de protección del patrimonio natural y científico de Canarias."
