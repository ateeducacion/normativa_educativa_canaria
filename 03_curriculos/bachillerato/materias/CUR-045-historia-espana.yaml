observaciones: "Materia común de 2.º de Bachillerato. Integra la perspectiva canaria en todos los bloques. Re-extracción del 2026-08-05: las 8 competencias específicas llevan ya enunciado_oficial literal y descriptores operativos (DEC-0008), tomados de texto-oficial-CUR-045-historia-espana.txt; la materia solo se imparte en 2.º de Bachillerato, así que 'descriptores' lleva una única clave de curso. Aviso: la numeración C1-C8 de esta ficha ya no coincide con el orden de la versión anterior (que era un resumen no literal); ahora sigue el orden 1-8 del propio decreto. [PENDIENTE] criterios_evaluacion y saberes_basicos siguen siendo una muestra parcial, no la relación literal completa del decreto (26 criterios de evaluación en total); extracción marcada como parcial."
