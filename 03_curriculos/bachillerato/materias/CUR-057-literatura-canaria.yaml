id: CUR-057
titulo: "Literatura Canaria — 2.º Bachillerato"
etapa: "bachillerato"
materia: "Literatura Canaria"
norma_base: NOR-005
fuente: FTE-009
url_oficial: "https://www.gobiernodecanarias.org/boc/2023/058/001.html"
fecha_consulta: 2026-04-26
estado_extraccion: "parcial"
estado_vigencia: "Vigente"
elementos:
  competencias_especificas:
    - codigo: "C1"
      enunciado_oficial: "Leer, escuchar, interpretar y valorar obras de la literatura canaria, vinculando sus singularidades con el contexto, la tradición y la producción actual, para acrecentar la interpretación crítica en el alumnado y contribuir gradualmente a la construcción de su propio mapa cultural."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL2, CCL3, CCL4, STEM5, CC1, CCEC1, CCEC2]
    - codigo: "C2"
      enunciado_oficial: "Leer y valorar de forma autónoma obras de la literatura canaria como fuente de placer y conocimiento, vinculando estas a la tradición y a la producción actual, y compartiendo experiencias de lectura para construir una interpretación propia debidamente argumentada y desarrollar una personalidad lectora independiente."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL4, CPSAA1.1, CPSAA3.1, CCEC1, CCEC2, CCEC3.1]
    - codigo: "C3"
      enunciado_oficial: "Relacionar y comparar textos y obras de la literatura canaria entre sí y con los de otras tradiciones literarias, reflexionando con sentido crítico sobre los elementos genéricos y los recursos expresivos que presentan y vinculando sus singularidades con el contexto sociohistórico, la tradición y el presente, para construir y compartir interpretaciones personales y generar nuevo conocimiento."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL3, CCL4, CP3, CD1, CD2, CPSAA4, CC1, CCEC1, CCEC2]
    - codigo: "C4"
      enunciado_oficial: "Relacionar e integrar, con actitud crítica y perspectiva holística, textos y obras de la literatura canaria con otras manifestaciones culturales, sociales y digitales, fomentando el análisis reflexivo sobre el papel de la literatura en el marco de los sistemas de comunicación global, para favorecer el conocimiento de la relación existente entre literatura y sociedad, y construir conocimiento de manera informada y activa."
      descriptores:
        "2.º Bachillerato": [CCL1, CCL2, CCL3, CCL5, CP3, STEM5, CD2, CD3, CPSAA3.1, CPSAA3.2, CPSAA5, CC4, CCEC2, CCEC4.1]
    - codigo: "C5"
      enunciado_oficial: "Expresar ideas, opiniones, sentimientos y emociones propios con creatividad, corrección y espíritu crítico, a través de la confluencia de la expresión literaria con otras herramientas y lenguajes, mostrando iniciativa e imaginación, para lograr un aprendizaje efectivo, consolidar una personalidad independiente y empática, y desarrollar la identidad personal y la inteligencia a través de la práctica artística."
      descriptores:
        "2.º Bachillerato": [CCL1, CD3, CPSAA1.1, CPSAA3.1, CE1, CCEC3.1, CCEC3.2, CCEC4.1, CCEC4.2]
  descriptores_operativos: ["CCL1", "CCL2", "CCL3", "CCL4", "CCL5", "CP3", "STEM5", "CD1", "CD2", "CD3", "CPSAA1.1", "CPSAA3.1", "CPSAA3.2", "CPSAA4", "CPSAA5", "CC1", "CC4", "CE1", "CCEC1", "CCEC2", "CCEC3.1", "CCEC3.2", "CCEC4.1", "CCEC4.2"]
  saberes_basicos:
    - id: itinerarios-lectores
      nombre: "I. Itinerarios lectores"
      descripcion: "Lectura guiada de obras clave y autores/as de Canarias; temas recurrentes (insularidad, emigración, identidad)."
    - id: patrimonio-literario
      nombre: "II. El patrimonio literario canario"
      descripcion: "Evolución histórica, movimientos literarios en las islas y singularidad de las voces canarias."
    - id: creacion-literaria
      nombre: "III. Creación y experimentación"
      descripcion: "Talleres de escritura creativa basados en la tradición literaria de las islas."
  criterios_evaluacion:
    - id: 1.1
      texto: "Explicar y argumentar la interpretación de obras de la literatura canaria analizando su contexto sociohistórico y valores culturales."
    - id: 2.1
      texto: "Desarrollar un itinerario lector propio, seleccionando y leyendo obras de la literatura canaria de manera autónoma."
    - id: 4.2
      texto: "Valorar la importancia de la literatura canaria como parte esencial del patrimonio cultural de las islas y su proyección universal."
relaciones:
  desarrolla_a: [NOR-005]
  relacionada_con: []
observaciones: "Materia de oferta obligatoria en 2.º de Bachillerato en Canarias. Re-extracción del 2026-08-05: las 5 competencias específicas llevan ya enunciado_oficial literal y descriptores operativos (DEC-0008), tomados de texto-oficial-CUR-057-literatura-canaria.txt; la materia solo se imparte en 2.º de Bachillerato, así que 'descriptores' lleva una única clave de curso. [PENDIENTE] criterios_evaluacion y saberes_basicos siguen siendo una muestra parcial, no la relación literal completa del decreto; extracción marcada como parcial."
