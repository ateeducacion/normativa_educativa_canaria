$schema: "https://json-schema.org/draft/2020-12/schema"
additionalProperties: false

# `siguiente_accion` y `fecha_cierre` son opcionales: una tarea cerrada no tiene
# acción siguiente, y sólo las que se cerraron formalmente llevan fecha de cierre.
# El enum de `estado` recoge el vocabulario realmente usado en el backlog.

type: object
required: [id, titulo, estado, tipo, fecha_creacion, fecha_actualizacion, relacionadas]
properties:
  id:
    type: string
    pattern: '^TAREA-[0-9]{3}$'
  titulo:
    type: string
  estado:
    type: string
    enum: [Pendiente, En progreso, Hecha, Bloqueada]
  prioridad:
    type: string
    enum: [Crítica, Alta, Media, Baja]
  tipo:
    type: string
  responsable:
    type: string
  fecha_creacion:
    type: string
  fecha_actualizacion:
    type: string
  fecha_cierre:
    type: [string, 'null']
  relacionadas:
    type: array
    items:
      type: string
  siguiente_accion:
    type: [string, 'null']
