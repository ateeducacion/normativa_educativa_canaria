  - id: NOR-043
    articulo: "1"
    num: "Artículo 1."
    heading: "Objeto y ámbito de aplicación."
    work_uri: "/akn/es-cn/act/2022-11-10/211"
    frbr_name: "Decreto"
    frbr_number: "211"
    country: "es-cn"
    work_date: "2022-11-10"
    expression_date: "2022-11-23"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/231/001.html"
    parrafos:
      - num: "1."
        text: "El presente Decreto tiene por objeto establecer la ordenación y el currículo de la etapa de Educación Primaria, en desarrollo de lo dispuesto en el Real Decreto 157/2022, de 1 de marzo, por el que se establecen la ordenación y las enseñanzas mínimas de la Educación Primaria."
      - num: "2."
        text: "Este Decreto será de aplicación en todos los centros docentes sostenidos con fondos públicos y privados que impartan las enseñanzas de esta etapa en el ámbito territorial de la Comunidad Autónoma de Canarias."
  - id: NOR-043
    articulo: "2"
    num: "Artículo 2."
    heading: "Definiciones."
    work_uri: "/akn/es-cn/act/2022-11-10/211"
    frbr_name: "Decreto"
    frbr_number: "211"
    country: "es-cn"
    work_date: "2022-11-10"
    expression_date: "2022-11-23"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/231/001.html"
    parrafos:
      - num: "1."
        text: "A los efectos de lo dispuesto en este Decreto, se entiende por currículo de la Educación Primaria el conjunto de objetivos, competencias, contenidos enunciados en forma de saberes básicos, criterios de evaluación, situaciones de aprendizaje y métodos pedagógicos. Todo ello ha de regular la práctica docente, de forma que se desarrollen de manera integral las capacidades del alumnado."
      - num: "2."
        text: "En base a lo explicitado en el apartado anterior, y en relación a lo dispuesto en este Decreto, se entenderá por:"
      - num: "a)"
        text: "Objetivos: logros que se espera que el alumnado haya alcanzado al finalizar la etapa y cuya consecución está vinculada al proceso de desarrollo y adquisición de las competencias clave y de las competencias específicas de cada área."
      - num: "b)"
        text: "Competencias clave: desempeños que se consideran imprescindibles para que el alumnado pueda progresar con garantías de éxito en su itinerario formativo, y afrontar los principales retos y desafíos globales y locales. Las competencias clave aparecen recogidas en el Perfil de salida del alumnado al término de la enseñanza básica (en adelante, Perfil de salida) y son la adaptación al sistema educativo español de las competencias clave establecidas en la Recomendación del Consejo de la Unión Europea, de 22 de mayo de 2018 relativa a las competencias clave para el aprendizaje permanente. Este perfil de salida ha sido adaptado, además, al nivel de desempeño esperado para el alumnado que finaliza la Educación Primaria."
      - num: "c)"
        text: "Competencias específicas: desempeños que el alumnado debe poder desplegar en actividades o en situaciones cuyo abordaje requiere de los saberes básicos de cada área. Las competencias específicas constituyen un elemento de conexión entre, por una parte, el Perfil de salida del alumnado, y, por otra, los saberes básicos de las áreas y los criterios de evaluación. Las competencias específicas de cada área, que serán comunes para todos los ciclos de la etapa, presentan un carácter finalista. Su grado de consecución en cada uno de los ciclos de la etapa viene determinado por los criterios de evaluación que se establecen para cada una de ellas."
      - num: "d)"
        text: "Criterios de evaluación: referentes que indican los niveles de desempeño esperados en el alumnado en las situaciones o actividades a las que se refieren las competencias específicas de cada área en un momento determinado de su proceso de aprendizaje. Constituyen los referentes para la evaluación tanto de los saberes propios de las áreas, como del grado de desarrollo y adquisición de las competencias específicas y clave."
      - num: "e)"
        text: "Saberes básicos: conocimientos, destrezas y actitudes que constituyen los contenidos propios de un área y cuyo aprendizaje es necesario para la adquisición de las competencias específicas."
      - num: "f)"
        text: "Situaciones de aprendizaje: situaciones y actividades que implican el despliegue, por parte del alumnado, de actuaciones asociadas a competencias clave y competencias específicas, y que contribuyen a la adquisición y desarrollo de las mismas."
  - id: NOR-047
    articulo: "1"
    num: "Artículo 1."
    heading: "Objeto y ámbito de aplicación."
    work_uri: "/akn/es-cn/act/2022-10-13/196"
    frbr_name: "Decreto"
    frbr_number: "196"
    country: "es-cn"
    work_date: "2022-10-13"
    expression_date: "2022-10-26"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
    parrafos:
      - num: "1."
        text: "El presente Decreto tiene por objeto establecer la ordenación y el currículo en la etapa de Educación Infantil."
      - num: "2."
        text: "Este Decreto será de aplicación a todos los centros docentes sostenidos con fondos públicos y privados que impartan la citada etapa educativa en el ámbito de la Comunidad Autónoma de Canarias."
  - id: NOR-047
    articulo: "2"
    num: "Artículo 2."
    heading: "Definiciones."
    work_uri: "/akn/es-cn/act/2022-10-13/196"
    frbr_name: "Decreto"
    frbr_number: "196"
    country: "es-cn"
    work_date: "2022-10-13"
    expression_date: "2022-10-26"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
    parrafos:
      - num: "1."
        text: "A los efectos de lo dispuesto en este Decreto, se entiende por currículo de la Educación Infantil el conjunto de objetivos, competencias clave, competencias específicas, criterios de evaluación, contenidos, enunciados en forma de saberes básicos y métodos pedagógicos, que han de configurar las programaciones didácticas del profesorado y regular su práctica docente, de forma que contribuyan al desarrollo armónico e integral del alumnado desde el nacimiento hasta los 6 años de edad."
      - num: "2."
        text: "En relación a lo dispuesto en este Decreto, se entenderá por:"
      - num: "a)"
        text: "Objetivos: logros que se espera que el alumnado haya alcanzado al finalizar la etapa y cuya consecución está vinculada al proceso de desarrollo y adquisición de las competencias clave, que se inicia en esta etapa, y de las competencias específicas de cada área."
      - num: "b)"
        text: "Competencias clave: desempeños que se consideran imprescindibles para que el alumnado pueda progresar con garantías de éxito en su itinerario formativo y afrontar los principales retos y desafíos, tanto globales como locales."
      - num: "c)"
        text: "Competencias específicas: desempeños que el alumnado debe poder desplegar en actividades o en situaciones cuyo abordaje requiere de los saberes básicos de cada área. Las competencias específicas constituyen un elemento de conexión entre, por una parte, las competencias clave y, por otra, los saberes básicos y los criterios de evaluación de las áreas. Las competencias específicas, que serán comunes para los dos ciclos de la etapa, presentan carácter finalista, por lo que deberán ser alcanzadas por el alumnado al término de la etapa. Su grado de consecución en cada uno de los ciclos viene determinado por los criterios de evaluación que se establecen para cada una de ellas."
      - num: "d)"
        text: "Criterios de evaluación: referentes que indican los niveles de desempeño esperados en el alumnado en las situaciones o actividades a las que se refieren las competencias específicas de cada área en un momento determinado de su proceso de aprendizaje. Constituyen los referentes para la evaluación tanto de los saberes propios de las áreas como del grado de desarrollo y adquisición de las competencias específicas."
      - num: "e)"
        text: "Saberes básicos: conocimientos, destrezas y actitudes que constituyen los contenidos propios de un área, y cuyo aprendizaje es necesario para la adquisición de las competencias específicas y clave."
      - num: "f)"
        text: "Situaciones de aprendizaje: situaciones y actividades que implican el despliegue, por parte del alumnado, de actuaciones asociadas a competencias clave y competencias específicas, y que contribuyen a la adquisición y al desarrollo de las mismas."
  - id: NOR-080
    articulo: "1"
    num: "Artículo 1."
    heading: "Objeto."
    work_uri: "/akn/es/act/2023-07-18/659"
    frbr_name: "Real Decreto"
    frbr_number: "659"
    country: "es"
    work_date: "2023-07-18"
    expression_date: "2023-07-22"
    author_eid: "gobierno-espana"
    author_href: "https://www.boe.es/"
    author_show: "Gobierno de España"
    fuente_texto: "https://www.boe.es/eli/es/rd/2023/07/18/659/con"
    parrafos:
      - text: "La presente disposición tiene por objeto el desarrollo de un sistema único e integrado de Formación Profesional regulado por la Ley Orgánica 3/2022, de 31 de marzo, de ordenación e integración de la Formación Profesional."
  - id: NOR-080
    articulo: "2"
    num: "Artículo 2."
    heading: "Finalidades del Sistema de Formación Profesional."
    work_uri: "/akn/es/act/2023-07-18/659"
    frbr_name: "Real Decreto"
    frbr_number: "659"
    country: "es"
    work_date: "2023-07-18"
    expression_date: "2023-07-22"
    author_eid: "gobierno-espana"
    author_href: "https://www.boe.es/"
    author_show: "Gobierno de España"
    fuente_texto: "https://www.boe.es/eli/es/rd/2023/07/18/659/con"
    parrafos:
      - text: "Son finalidades del Sistema de Formación Profesional:"
      - num: "a)"
        text: "La apertura de la Formación Profesional a toda la población, incluyendo la preparación para el primer acceso al mundo laboral, la formación profesional continua y la readaptación profesional, con la orientación profesional y acompañamiento que cada persona precise."
      - num: "b)"
        text: "La aportación, mediante ofertas formativas ordenadas, acumulables y acreditables, los conocimientos y las habilidades profesionales necesarios para una actividad profesional cualificada en un mundo laboral cambiante."
      - num: "c)"
        text: "Garantizar la formación profesional de personas trabajadoras, incluida la dirigida a la adaptación a las modificaciones operadas en el puesto de trabajo, así como al desarrollo de planes y acciones formativas tendentes a favorecer la empleabilidad, de acuerdo con el artículo 4.2.b) del Estatuto de los Trabajadores."
      - num: "d)"
        text: "La adquisición, mantenimiento, adaptación o ampliación de las habilidades y competencias profesionales y el progreso en la carrera profesional."
      - num: "e)"
        text: "La reconversión profesional y la reconducción del itinerario profesional a un sector de actividad distinto de aquellas personas trabajadoras que necesiten o deseen dirigirse hacia otro sector profesional."
      - num: "f)"
        text: "El reconocimiento y acreditación de las competencias profesionales adquiridas por experiencia laboral u otras vías no formales o informales."
      - num: "g)"
        text: "La promoción de la cooperación y gestión coordinada de las distintas administraciones públicas responsables de las políticas formativas de jóvenes y de personas trabajadoras, ocupadas o desempleadas, y la colaboración de la iniciativa privada."
  - id: NOR-003
    articulo: "3"
    num: "Artículo 3."
    heading: "La etapa de Educación Secundaria Obligatoria en el marco del sistema educativo."
    work_uri: "/akn/es/act/2022-03-29/217"
    frbr_name: "Real Decreto"
    frbr_number: "217"
    country: "es"
    work_date: "2022-03-29"
    expression_date: "2022-03-30"
    author_eid: "gobierno-espana"
    author_href: "https://www.boe.es/"
    author_show: "Gobierno de España"
    fuente_texto: "07_corpus_ia/textos-completos/texto-oficial-NOR-003-rd-217-2022.txt"
    nota: "Contrastado además con el texto consolidado del BOE (BOE-A-2022-4975) el 2026-08-22."
    parrafos:
      - num: "1."
        text: "La Educación Secundaria Obligatoria es una etapa educativa que constituye, junto con la Educación Primaria y los Ciclos Formativos de Grado Básico, la Educación Básica."
      - num: "2."
        text: "Esta etapa comprende cuatro cursos y se organiza en materias y en ámbitos."
      - num: "3."
        text: "El cuarto curso tendrá carácter orientador, tanto para los estudios postobligatorios como para la incorporación a la vida laboral."
  - id: NOR-004
    articulo: "3"
    num: "Artículo 3.-"
    heading: "Principios rectores."
    work_uri: "/akn/es-cn/act/2014-07-25/6"
    frbr_name: "Ley"
    frbr_number: "6"
    country: "es-cn"
    work_date: "2014-07-25"
    expression_date: "2014-08-07"
    author_eid: "parlamento-canarias"
    author_href: "https://www.parcan.es/"
    author_show: "Parlamento de Canarias"
    fuente_texto: "07_corpus_ia/textos-completos/texto-oficial-NOR-004-ley-canaria-6-2014.txt"
    nota: "Contrastado además con el BOC núm. 152, de 07/08/2014 (https://www.gobiernodecanarias.org/boc/2014/152/002.html) el 2026-08-22."
    parrafos:
      - text: "Los principios rectores que regirán el sistema educativo canario serán:"
      - num: "a)"
        text: "Un sistema educativo de calidad, entendido como un sistema que garantice la equidad y la excelencia, con capacidad de ofrecer a cada persona el tipo de atención pedagógica que necesita, garantizar una amplia igualdad de oportunidades, facilitar la participación social, promover la eficacia en todos los centros para atender a las necesidades educativas del alumnado y alcanzar los mejores resultados de aprendizaje en todo el alumnado."
      - num: "b)"
        text: "La equidad del sistema educativo para evitar que las desigualdades económicas y sociales limiten las oportunidades de aprendizaje y se conviertan en un determinante del éxito escolar."
      - num: "c)"
        text: "La mejora continua de los centros y servicios educativos para que en cada momento puedan ofrecer la respuesta más adecuada dadas las características del alumnado y las condiciones disponibles, aportando su propio valor añadido a las condiciones definidas para el conjunto del sistema educativo."
      - num: "d)"
        text: "La educación en y para la convivencia basada en el respeto, la solidaridad y la igualdad, la construcción de una cultura de paz dirigida a la prevención de los conflictos y su resolución mediante el diálogo, la coeducación y la igualdad efectiva entre hombres y mujeres."
      - num: "e)"
        text: "La corresponsabilidad de todos los agentes educativos para lograr que la educación sea considerada como uno de los bienes más preciados dentro de la sociedad y que toda la población pueda formarse a lo largo de la vida."
      - num: "f)"
        text: "La cooperación entre las administraciones públicas, así como entre las administraciones públicas y los agentes económicos y sociales para impulsar el desarrollo, la investigación y la innovación. Esta cooperación tendrá como ejes prioritarios los siguientes: la reducción del absentismo escolar, la mejora del rendimiento escolar, la promoción de la educación no formal y de los aprendizajes que tienen lugar en contextos informales y la prestación de aquellos servicios complementarios que la ley considere adecuados para una gestión compartida."
  - id: NOR-005
    articulo: "3"
    num: "Artículo 3."
    heading: "Currículo."
    work_uri: "/akn/es-cn/act/2023-03-16/30"
    frbr_name: "Decreto"
    frbr_number: "30"
    country: "es-cn"
    work_date: "2023-03-16"
    expression_date: "2023-03-23"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2023/058/001.html"
    parrafos:
      - num: "1."
        text: "El currículo de la ESO y del Bachillerato se organiza en materias o ámbitos, en su caso, que garantizarán un tratamiento integrador de los aprendizajes, vertebrados estos con el tratamiento de contenidos de carácter transversal, para asegurar que el alumnado alcance los objetivos previstos para la etapa, así como el grado de desarrollo y adquisición de las competencias clave, definidas a través de los descriptores operativos establecidos en el Perfil de salida del alumnado al término de la enseñanza básica y de los determinados para el Bachillerato."
      - num: "2."
        text:
          - "El currículo de las materias y los ámbitos, en su caso, se organiza, para los diferentes cursos de la ESO y del Bachillerato, en bloques competenciales que integran las competencias específicas, los criterios de evaluación asociados y la vinculación de estos elementos con los descriptores operativos del Perfil de salida en la ESO, y con los descriptores operativos establecidos para la etapa de Bachillerato."
          - "Estos bloques competenciales incluyen, asimismo, una explicación que orienta sobre el proceso de evaluación de los aprendizajes incluidos en cada uno de los bloques competenciales, recogiendo, asimismo, orientaciones de tipo metodológico y facilitando, de manera general, la vinculación con los saberes básicos. El currículo determina, asimismo, los saberes básicos establecidos para cada nivel en ambas etapas."
      - num: "3."
        text: "Los aprendizajes referidos al conocimiento, la valoración y la conservación del patrimonio cultural, histórico, natural, social y lingüístico de la Comunidad Autónoma de Canarias, se han integrado de manera transversal en los currículos de las diferentes materias o ámbitos."
      - num: "4."
        text: "En los anexos 2 y 3 de este Decreto se establecen, para el ámbito de la Comunidad Autónoma de Canarias, los currículos de cada una de las materias y los cursos de la ESO y del Bachillerato, respectivamente."
      - num: "5."
        text: "Los centros docentes, en el uso de su autonomía, desarrollarán y completarán estos currículos, y los concretarán en las programaciones didácticas, formando parte del proyecto educativo del centro y de la programación general anual."
      - num: "6."
        text: "La programación didáctica será el instrumento de planificación curricular que permita desarrollar los procesos de enseñanza y aprendizaje, de manera coordinada entre todo el profesorado que integra un departamento de coordinación didáctica. La programación didáctica, en estas etapas educativas, se estructurará en situaciones de aprendizaje, y deberá estar centrada en el desarrollo y la adquisición de las competencias clave y específicas, tomándose como referencia los criterios de evaluación establecidos para cada materia o ámbito en el presente Decreto. La Consejería competente en materia de educación dictará instrucciones sobre los elementos que deberán conformar las programaciones didácticas y su contenido."
      - num: "7."
        text: "Para la adquisición y el desarrollo, tanto de las competencias clave como de las competencias específicas, el equipo docente planificará y diseñará situaciones de aprendizaje, en los términos que se dispongan desde la Consejería competente en materia de educación."
      - num: "8."
        text: "El Anexo 4 del presente Decreto, que no presenta carácter prescriptivo, establece el marco general para el diseño de situaciones de aprendizaje en el seno de la etapa de la ESO y del Bachillerato. La Consejería competente en materia de educación podrá concretar lo establecido de manera general en dicho anexo."
  - id: NOR-006
    articulo: "3"
    num: "Artículo 3."
    heading: "La etapa de Bachillerato en el marco del sistema educativo."
    work_uri: "/akn/es/act/2022-04-05/243"
    frbr_name: "Real Decreto"
    frbr_number: "243"
    country: "es"
    work_date: "2022-04-05"
    expression_date: "2022-04-06"
    author_eid: "gobierno-espana"
    author_href: "https://www.boe.es/"
    author_show: "Gobierno de España"
    fuente_texto: "07_corpus_ia/textos-completos/texto-oficial-NOR-006-rd-243-2022.txt"
    nota: "Contrastado además con el texto consolidado del BOE (BOE-A-2022-5521) el 2026-08-22."
    parrafos:
      - num: "1."
        text: "La educación secundaria se divide en educación secundaria obligatoria y educación secundaria postobligatoria."
      - num: "2."
        text: "El Bachillerato es una de las enseñanzas que conforman la educación secundaria postobligatoria, junto con la Formación Profesional de Grado Medio, las Enseñanzas Artísticas Profesionales, tanto de Música y de Danza como de Artes Plásticas y Diseño de Grado Medio, y las Enseñanzas Deportivas de Grado Medio."
      - num: "3."
        text: "Sin perjuicio de lo previsto en el artículo 15, la etapa comprende dos cursos, se desarrolla en modalidades diferentes y se organiza de modo flexible en materias comunes, materias de modalidad y materias optativas, a fin de que pueda ofrecer una preparación especializada a los alumnos y alumnas acorde con sus perspectivas e intereses de formación o permita la incorporación a la vida activa una vez finalizado el mismo."
  - id: NOR-043
    articulo: "3"
    num: "Artículo 3.-"
    heading: "Principios generales."
    work_uri: "/akn/es-cn/act/2022-11-10/211"
    frbr_name: "Decreto"
    frbr_number: "211"
    country: "es-cn"
    work_date: "2022-11-10"
    expression_date: "2022-11-23"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/231/001.html"
    parrafos:
      - num: "1."
        text: "La Educación Primaria tiene carácter obligatorio y gratuito, abarca seis cursos académicos y se cursará, con carácter general, entre los 6 y los 12 años."
      - num: "2."
        text: "La Educación Primaria proporcionará a todos los niños y las niñas una educación de calidad, en condiciones de equidad y con garantía de igualdad de oportunidades."
      - num: "3."
        text: "El conjunto de la actividad educativa contribuirá al desarrollo pleno del alumnado a través de la integración de las distintas experiencias y aprendizajes desde una perspectiva global, que permita asimismo la adaptación de los procesos de enseñanza y de aprendizaje a los diferentes ritmos de trabajo y estilos de aprendizaje del alumnado."
      - num: "4."
        text: "Las medidas organizativas, metodológicas y curriculares que se adopten se regirán por los principios del Diseño Universal para el Aprendizaje, de manera que se posibilite el acceso al currículo para todo el alumnado y que se responda a las fortalezas y necesidades de este en función de sus características individuales. Para ello, se contará con los recursos materiales y humanos necesarios y adecuados."
      - num: "5."
        text: "La actividad educativa, que implica la participación de toda la comunidad, contribuirá al desarrollo pleno del alumnado a través de la integración curricular de los valores y los aprendizajes que incidan en el desarrollo y la adquisición de las competencias clave, que le permitan el ejercicio de una ciudadanía responsable, consciente y respetuosa de los derechos y las libertades fundamentales, de la igualdad efectiva de derechos y oportunidades entre hombres y mujeres, y de la diversidad afectivo sexual; una ciudadanía crítica con las desigualdades, los comportamientos sexistas y todas clase de discriminaciones por razón de sexo, edad, religión, cultura, opción afectivo-sexual, capacidad."
      - num: "6."
        text: "Las relaciones interpersonales se sustentarán en el ejercicio de la tolerancia y de la libertad, propio de una ciudadanía democrática donde la participación sea la estrategia para lograr la corresponsabilidad de toda la comunidad educativa y donde la convivencia positiva, la prevención de conflictos y su resolución pacífica sean los principios rectores insertados, de manera transversal, en los procesos de enseñanza y aprendizaje."
  - id: NOR-047
    articulo: "3"
    num: "Artículo 3.-"
    heading: "Fines."
    work_uri: "/akn/es-cn/act/2022-10-13/196"
    frbr_name: "Decreto"
    frbr_number: "196"
    country: "es-cn"
    work_date: "2022-10-13"
    expression_date: "2022-10-26"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
    nota: "Hay corrección de errores en el BOC núm. 214, de 28/10/2022, que solo afecta al preámbulo."
    parrafos:
      - num: "1."
        text: "La finalidad de la Educación Infantil es contribuir al desarrollo integral y armónico del alumnado en todas sus dimensiones: física, emocional, sexual, afectiva, social, cognitiva y artística."
      - num: "2."
        text: "Se atenderá al progresivo desarrollo afectivo del alumnado, facilitando la construcción de nuevos vínculos y relaciones, e iniciando a los niños y a las niñas en la educación emocional. Se propiciará, además, que los niños y las niñas elaboren progresivamente una autoimagen positiva y equilibrada, y que adquieran gradualmente autonomía personal y hábitos de control corporal, así como de salud, cuidado y bienestar propios de un estilo de vida saludable. Se promoverán la adquisición de pautas elementales de convivencia, relación social y gestión de las emociones; así como el desarrollo de la comunicación y el lenguaje, iniciándose en la comunicación en una primera lengua extranjera y en el proceso de alfabetización digital y mediática, así como en las destrezas del pensamiento computacional."
      - num: "3."
        text: "Se promoverá, asimismo, el descubrimiento de las características físicas, sociales y culturales del medio. De esta manera, el currículo de la Educación Infantil, en la Comunidad Autónoma de Canarias, contribuirá a que el alumnado se inicie en el conocimiento, aprecio y respeto de los aspectos culturales, históricos, geográficos, naturales, sociales y lingüísticos más relevantes de Canarias, así como los de su entorno, según lo requieran las diferentes áreas, comenzando a integrar las posibilidades de acción para su conservación."
      - num: "4."
        text: "La implementación del currículo de la Educación Infantil en la Comunidad Autónoma de Canarias se orientará, además, a la consecución de los siguientes fines:"
      - num: "4.a)"
        text: "La incorporación de aprendizajes, valores y actitudes que contribuyan a que el alumnado se inicie en actitudes en pro de la sostenibilidad ambiental y del cuidado del medio natural, social y cultural."
      - num: "4.b)"
        text: "El desarrollo en los niños y en las niñas de la capacidad para adquirir hábitos y valores solidarios y de equidad."
      - num: "4.c)"
        text: "La no discriminación de las personas por razones de identidad y orientación sexual, religión, procedencia o cultura."
      - num: "4.d)"
        text: "La eliminación de los prejuicios, estereotipos y roles en función del sexo o de la orientación sexual o de la identidad y expresión de género, la integración del saber de las mujeres y su contribución social e histórica al desarrollo de la humanidad, la prevención de la violencia de género, el fomento vínculos afectivos saludables y la coeducación."
      - num: "4.e)"
        text: "El desarrollo progresivo del autoconocimiento, la autoestima, la gestión de las emociones y los sentimientos, en pro del desarrollo personal y social."
      - num: "4.f)"
        text: "La atención al alumnado desde el principio de inclusión, equidad y compensación de las posibles situaciones de vulnerabilidad que puedan incidir en su desarrollo personal, social y educativo."
  - id: NOR-079
    articulo: "3"
