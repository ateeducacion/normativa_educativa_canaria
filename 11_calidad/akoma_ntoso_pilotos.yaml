    fuente_texto: "https://www.gobiernodecanarias.org/boc/2023/058/001.html"
    parrafos:
      - num: "1."
        text: "El presente Decreto tiene por objeto establecer la ordenación y el currículo de las etapas educativas de la ESO y el Bachillerato en la Comunidad Autónoma de Canarias."
      - num: "2."
        text: "Lo establecido en este Decreto será de aplicación en todos los centros educativos, públicos y privados, que impartan las citadas etapas educativas en el ámbito de la Comunidad Autónoma de Canarias."
