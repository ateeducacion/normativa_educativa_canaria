  - id: NOR-043
    articulo: "1"
    num: "Artículo 1."
    heading: "Objeto y ámbito de aplicación."
    work_uri: "/akn/es-cn/act/2022-11-10/211"
    frbr_name: "Decreto"
    frbr_number: "211"
    country: "es-cn"
    work_date: "2022-11-10"
    expression_date: "2022-11-23"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/231/001.html"
    parrafos:
      - num: "1."
        text: "El presente Decreto tiene por objeto establecer la ordenación y el currículo de la etapa de Educación Primaria, en desarrollo de lo dispuesto en el Real Decreto 157/2022, de 1 de marzo, por el que se establecen la ordenación y las enseñanzas mínimas de la Educación Primaria."
      - num: "2."
        text: "Este Decreto será de aplicación en todos los centros docentes sostenidos con fondos públicos y privados que impartan las enseñanzas de esta etapa en el ámbito territorial de la Comunidad Autónoma de Canarias."
  - id: NOR-043
    articulo: "2"
    num: "Artículo 2."
    heading: "Definiciones."
    work_uri: "/akn/es-cn/act/2022-11-10/211"
    frbr_name: "Decreto"
    frbr_number: "211"
    country: "es-cn"
    work_date: "2022-11-10"
    expression_date: "2022-11-23"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/231/001.html"
    parrafos:
      - num: "1."
        text: "A los efectos de lo dispuesto en este Decreto, se entiende por currículo de la Educación Primaria el conjunto de objetivos, competencias, contenidos enunciados en forma de saberes básicos, criterios de evaluación, situaciones de aprendizaje y métodos pedagógicos. Todo ello ha de regular la práctica docente, de forma que se desarrollen de manera integral las capacidades del alumnado."
      - num: "2."
        text: "En base a lo explicitado en el apartado anterior, y en relación a lo dispuesto en este Decreto, se entenderá por:"
      - num: "a)"
        text: "Objetivos: logros que se espera que el alumnado haya alcanzado al finalizar la etapa y cuya consecución está vinculada al proceso de desarrollo y adquisición de las competencias clave y de las competencias específicas de cada área."
      - num: "b)"
        text: "Competencias clave: desempeños que se consideran imprescindibles para que el alumnado pueda progresar con garantías de éxito en su itinerario formativo, y afrontar los principales retos y desafíos globales y locales. Las competencias clave aparecen recogidas en el Perfil de salida del alumnado al término de la enseñanza básica (en adelante, Perfil de salida) y son la adaptación al sistema educativo español de las competencias clave establecidas en la Recomendación del Consejo de la Unión Europea, de 22 de mayo de 2018 relativa a las competencias clave para el aprendizaje permanente. Este perfil de salida ha sido adaptado, además, al nivel de desempeño esperado para el alumnado que finaliza la Educación Primaria."
      - num: "c)"
        text: "Competencias específicas: desempeños que el alumnado debe poder desplegar en actividades o en situaciones cuyo abordaje requiere de los saberes básicos de cada área. Las competencias específicas constituyen un elemento de conexión entre, por una parte, el Perfil de salida del alumnado, y, por otra, los saberes básicos de las áreas y los criterios de evaluación. Las competencias específicas de cada área, que serán comunes para todos los ciclos de la etapa, presentan un carácter finalista. Su grado de consecución en cada uno de los ciclos de la etapa viene determinado por los criterios de evaluación que se establecen para cada una de ellas."
      - num: "d)"
        text: "Criterios de evaluación: referentes que indican los niveles de desempeño esperados en el alumnado en las situaciones o actividades a las que se refieren las competencias específicas de cada área en un momento determinado de su proceso de aprendizaje. Constituyen los referentes para la evaluación tanto de los saberes propios de las áreas, como del grado de desarrollo y adquisición de las competencias específicas y clave."
      - num: "e)"
        text: "Saberes básicos: conocimientos, destrezas y actitudes que constituyen los contenidos propios de un área y cuyo aprendizaje es necesario para la adquisición de las competencias específicas."
      - num: "f)"
        text: "Situaciones de aprendizaje: situaciones y actividades que implican el despliegue, por parte del alumnado, de actuaciones asociadas a competencias clave y competencias específicas, y que contribuyen a la adquisición y desarrollo de las mismas."
  - id: NOR-047
    articulo: "1"
    num: "Artículo 1."
    heading: "Objeto y ámbito de aplicación."
    work_uri: "/akn/es-cn/act/2022-10-13/196"
    frbr_name: "Decreto"
    frbr_number: "196"
    country: "es-cn"
    work_date: "2022-10-13"
    expression_date: "2022-10-26"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
    parrafos:
      - num: "1."
        text: "El presente Decreto tiene por objeto establecer la ordenación y el currículo en la etapa de Educación Infantil."
      - num: "2."
        text: "Este Decreto será de aplicación a todos los centros docentes sostenidos con fondos públicos y privados que impartan la citada etapa educativa en el ámbito de la Comunidad Autónoma de Canarias."
  - id: NOR-047
    articulo: "2"
    num: "Artículo 2."
    heading: "Definiciones."
    work_uri: "/akn/es-cn/act/2022-10-13/196"
    frbr_name: "Decreto"
    frbr_number: "196"
    country: "es-cn"
    work_date: "2022-10-13"
    expression_date: "2022-10-26"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2022/212/001.html"
    parrafos:
      - num: "1."
        text: "A los efectos de lo dispuesto en este Decreto, se entiende por currículo de la Educación Infantil el conjunto de objetivos, competencias clave, competencias específicas, criterios de evaluación, contenidos, enunciados en forma de saberes básicos y métodos pedagógicos, que han de configurar las programaciones didácticas del profesorado y regular su práctica docente, de forma que contribuyan al desarrollo armónico e integral del alumnado desde el nacimiento hasta los 6 años de edad."
      - num: "2."
        text: "En relación a lo dispuesto en este Decreto, se entenderá por:"
      - num: "a)"
        text: "Objetivos: logros que se espera que el alumnado haya alcanzado al finalizar la etapa y cuya consecución está vinculada al proceso de desarrollo y adquisición de las competencias clave, que se inicia en esta etapa, y de las competencias específicas de cada área."
      - num: "b)"
        text: "Competencias clave: desempeños que se consideran imprescindibles para que el alumnado pueda progresar con garantías de éxito en su itinerario formativo y afrontar los principales retos y desafíos, tanto globales como locales."
      - num: "c)"
        text: "Competencias específicas: desempeños que el alumnado debe poder desplegar en actividades o en situaciones cuyo abordaje requiere de los saberes básicos de cada área. Las competencias específicas constituyen un elemento de conexión entre, por una parte, las competencias clave y, por otra, los saberes básicos y los criterios de evaluación de las áreas. Las competencias específicas, que serán comunes para los dos ciclos de la etapa, presentan carácter finalista, por lo que deberán ser alcanzadas por el alumnado al término de la etapa. Su grado de consecución en cada uno de los ciclos viene determinado por los criterios de evaluación que se establecen para cada una de ellas."
      - num: "d)"
        text: "Criterios de evaluación: referentes que indican los niveles de desempeño esperados en el alumnado en las situaciones o actividades a las que se refieren las competencias específicas de cada área en un momento determinado de su proceso de aprendizaje. Constituyen los referentes para la evaluación tanto de los saberes propios de las áreas como del grado de desarrollo y adquisición de las competencias específicas."
      - num: "e)"
        text: "Saberes básicos: conocimientos, destrezas y actitudes que constituyen los contenidos propios de un área, y cuyo aprendizaje es necesario para la adquisición de las competencias específicas y clave."
      - num: "f)"
        text: "Situaciones de aprendizaje: situaciones y actividades que implican el despliegue, por parte del alumnado, de actuaciones asociadas a competencias clave y competencias específicas, y que contribuyen a la adquisición y al desarrollo de las mismas."
  - id: NOR-080
    articulo: "1"
    num: "Artículo 1."
    heading: "Objeto."
    work_uri: "/akn/es/act/2023-07-18/659"
    frbr_name: "Real Decreto"
    frbr_number: "659"
    country: "es"
    work_date: "2023-07-18"
    expression_date: "2023-07-22"
    author_eid: "gobierno-espana"
    author_href: "https://www.boe.es/"
    author_show: "Gobierno de España"
    fuente_texto: "https://www.boe.es/eli/es/rd/2023/07/18/659/con"
    parrafos:
      - text: "La presente disposición tiene por objeto el desarrollo de un sistema único e integrado de Formación Profesional regulado por la Ley Orgánica 3/2022, de 31 de marzo, de ordenación e integración de la Formación Profesional."
  - id: NOR-080
    articulo: "2"
    num: "Artículo 2."
    heading: "Finalidades del Sistema de Formación Profesional."
    work_uri: "/akn/es/act/2023-07-18/659"
    frbr_name: "Real Decreto"
    frbr_number: "659"
    country: "es"
    work_date: "2023-07-18"
    expression_date: "2023-07-22"
    author_eid: "gobierno-espana"
    author_href: "https://www.boe.es/"
    author_show: "Gobierno de España"
    fuente_texto: "https://www.boe.es/eli/es/rd/2023/07/18/659/con"
    parrafos:
      - text: "Son finalidades del Sistema de Formación Profesional:"
      - num: "a)"
        text: "La apertura de la Formación Profesional a toda la población, incluyendo la preparación para el primer acceso al mundo laboral, la formación profesional continua y la readaptación profesional, con la orientación profesional y acompañamiento que cada persona precise."
      - num: "b)"
        text: "La aportación, mediante ofertas formativas ordenadas, acumulables y acreditables, los conocimientos y las habilidades profesionales necesarios para una actividad profesional cualificada en un mundo laboral cambiante."
      - num: "c)"
        text: "Garantizar la formación profesional de personas trabajadoras, incluida la dirigida a la adaptación a las modificaciones operadas en el puesto de trabajo, así como al desarrollo de planes y acciones formativas tendentes a favorecer la empleabilidad, de acuerdo con el artículo 4.2.b) del Estatuto de los Trabajadores."
      - num: "d)"
        text: "La adquisición, mantenimiento, adaptación o ampliación de las habilidades y competencias profesionales y el progreso en la carrera profesional."
      - num: "e)"
        text: "La reconversión profesional y la reconducción del itinerario profesional a un sector de actividad distinto de aquellas personas trabajadoras que necesiten o deseen dirigirse hacia otro sector profesional."
      - num: "f)"
        text: "El reconocimiento y acreditación de las competencias profesionales adquiridas por experiencia laboral u otras vías no formales o informales."
      - num: "g)"
        text: "La promoción de la cooperación y gestión coordinada de las distintas administraciones públicas responsables de las políticas formativas de jóvenes y de personas trabajadoras, ocupadas o desempleadas, y la colaboración de la iniciativa privada."
