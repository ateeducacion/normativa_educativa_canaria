    work_uri: "/akn/es-cn/act/2014-07-25/6"
    frbr_name: "Ley"
    frbr_number: "6"
    country: "es-cn"
    work_date: "2014-07-25"
    expression_date: "2014-08-07"
    author_eid: "parlamento-canarias"
    author_href: "https://www.parcan.es/"
    author_show: "Parlamento de Canarias"
    fuente_texto: "07_corpus_ia/textos-completos/texto-oficial-NOR-004-ley-canaria-6-2014.txt"
    parrafos:
      - num: "1."
        text: "La presente ley tiene por objeto regular el sistema educativo canario y su evaluación, de modo que pueda convertirse en un instrumento eficaz para hacer efectivo el derecho a una educación de calidad, inclusiva e integradora, que garantice la equidad y la excelencia, la prestación de un servicio público esencial y convertirse, a la vez, en uno de los motores del desarrollo social, económico y cultural del archipiélago."
      - num: "2."
        text: "El ámbito de aplicación de la presente ley es todo el sistema educativo canario, a excepción del universitario, en consonancia con las competencias asumidas en el Estatuto de Autonomía de Canarias y en el desarrollo de las normas básicas aprobadas por el Estado."
  - id: NOR-005
    articulo: "1"
    num: "Artículo 1."
    heading: "Objeto y ámbito de aplicación."
    work_uri: "/akn/es-cn/act/2023-03-16/30"
    frbr_name: "Decreto"
    frbr_number: "30"
    country: "es-cn"
    work_date: "2023-03-16"
    expression_date: "2023-03-23"
    author_eid: "gobierno-canarias"
    author_href: "https://www.gobiernodecanarias.org/"
    author_show: "Gobierno de Canarias"
    fuente_texto: "https://www.gobiernodecanarias.org/boc/2023/058/001.html"
    parrafos:
      - num: "1."
        text: "El presente Decreto tiene por objeto establecer la ordenación y el currículo de las etapas educativas de la ESO y el Bachillerato en la Comunidad Autónoma de Canarias."
      - num: "2."
        text: "Lo establecido en este Decreto será de aplicación en todos los centros educativos, públicos y privados, que impartan las citadas etapas educativas en el ámbito de la Comunidad Autónoma de Canarias."
